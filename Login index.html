<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grão e aroma - login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="home_cabeçalho">
        <div class="home_container container_home">
            <img src="./img/Logo 2.png" alt="">
            <nav class="nav_cabeçalho">
                <a href="">nossos cafés</a>
                <a href="">fazer login</a>
                <a href="">recomendações</a>
            </nav>
        </div>
    </header>
    <form class="signup-form">
        <section class="container">
            <span class="subtitulo">sua jornada começa aqui</span>
            <hr>
            <h1 class="titulo">crie sua conta</h1>
            <span class="texto">leva menos de um minuto. O café a gente prepara depois.</span>

            <button>
                continuar com Google
            </button>
            <span class="linha">ou use seu e-mail</span>
        </section>
        <section class="login">
            <div class="input-group linha1">
                <label for="name">NOME COMPLETO</label>
                <input type="text" id="name" placeholder="Como podemos te chamar?">
            </div>

            <div class="input-group linha1">
                <label for="email">E-MAIL</label>
                <input type="email" id="email" placeholder="voce@exemplo.com">
            </div>
            <div class="input-group">
                <label for="password">CRIE UMA SENHA</label>
                <div class="linha3">
                    <input type="password" id="password" placeholder="No mínimo 6 caracteres">
                    <button type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="container_login linha2">
                <button class="button1">
                    Crie sua conta aqui
                </button>
            </div>
        </section>
    </form>
    <footer>
        <div class="footer_container">
            <img src="./img/Logo 2.png" alt="">
            <nav class="nav_footer">
                <a href=""></a>
                <a href="">facebook</a>
                <a href="">Intagran</a>
            </nav>
        </div>
    </footer>
</body>

</html>
